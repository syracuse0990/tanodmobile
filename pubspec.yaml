name: tanodmobile
description: "Tanod mobile app starter with Provider, Dio, Hive, and modular feature architecture."
 
publish_to: 'none' 
version: 1.0.0+4

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  dio: ^5.9.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  connectivity_plus: ^7.0.0
  equatable: ^2.0.8
  google_fonts: ^8.0.2
  intl: ^0.20.2
  pretty_dio_logger: ^1.4.0
  flutter_svg: ^2.2.4
  go_router: ^17.1.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  google_nav_bar: ^5.0.7
  firebase_messaging: ^16.1.3
  firebase_core: ^4.6.0
  web_socket_channel: ^3.0.3
  flutter_dotenv: ^6.0.0
  table_calendar: ^3.2.0
  google_maps_flutter: ^2.14.2
  google_maps_flutter_android: ^2.19.5
  google_maps_flutter_platform_interface: ^2.15.0
  geocoding: ^3.0.0
  geolocator: ^14.0.2
  image_picker: ^1.2.1
  google_mlkit_text_recognition: ^0.14.0
  flutter_local_notifications: ^21.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/ic_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/ic_launcher.png"
  remove_alpha_ios: true


flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/logos/
    - assets/animations/
